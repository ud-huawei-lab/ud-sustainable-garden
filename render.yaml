services:
  - type: web
    name: ud-sustainable-garden-api
    runtime: node
    plan: free
    repo: https://github.com/ud-huawei-lab/ud-sustainable-garden
    branch: main
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ORIGIN
        value: https://ud-sustainable-garden.vercel.app
      - key: HA_URL
        value: https://jnjtt9at8pwjtctcunrwlvs2mdegtpbf.ui.nabu.casa
      - key: HA_USERNAME
        sync: false
      - key: HA_PASSWORD
        sync: false
      - key: APP_USERNAME
        value: udlabs
      - key: APP_PASSWORD_HASH
        sync: false
